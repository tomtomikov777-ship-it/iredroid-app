name: iredroid
description: "Open-source infrared remote control app for Android devices."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path: ^1.8.3
  path_provider: ^2.1.1
  archive: ^3.4.10
  file_picker: ^8.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/flipper-irdb.zip
    - assets/iredroid_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/iredroid_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/iredroid_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/iredroid_logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/iredroid_logo.png"
